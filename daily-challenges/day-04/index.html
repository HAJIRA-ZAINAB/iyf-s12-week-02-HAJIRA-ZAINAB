<!DOCTYPE html>
<html>
<head>
<style>
body {
  font-family: Arial;
  padding: 30px;
  background: lightgray;
}
.form-box {
  width: 300px;
  background: white;
  padding: 20px;
  border-radius: 8px;
  margin: auto;
}
.form-box h2 {
  text-align: center;
}
input {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border: 1px solid gray;
  border-radius: 4px;
  box-sizing: border-box;
}
button {
  width: 100%;
  padding: 10px;
  background: black;
  color: white;
  border: none;
  border-radius: 4px;
  margin-top: 10px;
}
button:hover {
  background: gray;
}
</style>
</head>
<body>

<div class="form-box">
  <h2>Contact Me</h2>
  <input type="text" placeholder="Your Name">
  <input type="email" placeholder="Your Email">
  <input type="text" placeholder="Your Message">
  <button>Send Message</button>
</div>

</body>
</html>
